# Builds the iOS app in the cloud (GitHub's macOS runners) and uploads it to TestFlight.
# Windows can't build iOS apps, so this workflow is how the app gets to Gülay's iPhone.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_ISSUER_ID       App Store Connect API key issuer id
#   APPSTORE_KEY_ID          App Store Connect API key id
#   APPSTORE_PRIVATE_KEY     App Store Connect API private key (.p8 contents)
#   BUILD_CERTIFICATE_BASE64 Apple Distribution certificate (.p12) encoded as base64
#   P12_PASSWORD             Password of the .p12 certificate
#   PROVISIONING_PROFILE_BASE64  App Store provisioning profile (.mobileprovision) as base64,
#                            for com.deniz.gulaywardrobe
#   WIDGET_PROVISIONING_PROFILE_BASE64  App Store provisioning profile as base64,
#                            for com.deniz.gulaywardrobe.GulayWidget (only needed once the
#                            GulayWidget extension target exists — see WIDGET-SETUP.md)
#
# See README-APPSTORE.md and WIDGET-SETUP.md for step-by-step guides to create these.

name: iOS TestFlight build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npx cap sync ios

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "ci-password" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "ci-password" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "ci-password" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          # Only needed once the GulayWidget extension target exists (see WIDGET-SETUP.md).
          if [ -n "$WIDGET_PROVISIONING_PROFILE_BASE64" ]; then
            WPP_PATH=$RUNNER_TEMP/widget-profile.mobileprovision
            echo -n "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $WPP_PATH
            cp $WPP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          fi

      - name: Build and archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination 'generic/platform=iOS' \
            archive CODE_SIGN_STYLE=Manual
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8
          xcrun altool --upload-app -f $RUNNER_TEMP/export/*.ipa -t ios \
            --apiKey $APPSTORE_KEY_ID --apiIssuer $APPSTORE_ISSUER_ID
